<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f5f0">
    <title>Little List — To-do list</title>
    <style>
      :root {
        color-scheme: light;
        --page: #f6f5f0;
        --paper: #fffefa;
        --ink: #242721;
        --muted: #85877f;
        --line: #eae9e1;
        --green: #526b4d;
        --green-dark: #40563c;
        --green-pale: #edf1e9;
        --shadow: 0 18px 55px rgb(46 49 37 / 8%);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        padding: 64px 20px;
        background:
          radial-gradient(ellipse at 50% 0%, rgb(233 236 224 / 70%), transparent 48%),
          var(--page);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      button,
      input {
        font: inherit;
      }

      button {
        color: inherit;
      }

      .app {
        width: min(100%, 560px);
        margin: 0 auto;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        clip-path: inset(50%);
      }

      .intro {
        margin: 0 0 28px;
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: var(--green);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(40px, 9vw, 54px);
        font-weight: 400;
        letter-spacing: -0.045em;
        line-height: 1.08;
      }

      .subtitle {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 15px;
      }

      .list-card {
        overflow: hidden;
        border: 1px solid rgb(234 233 225 / 85%);
        border-radius: 18px;
        background: var(--paper);
        box-shadow: var(--shadow);
      }

      .add-form {
        display: flex;
        gap: 10px;
        padding: 20px;
        border-bottom: 1px solid var(--line);
      }

      .add-form input {
        min-width: 0;
        flex: 1;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        outline: none;
        background: #fff;
        color: var(--ink);
        font-size: 14px;
        transition: border-color 160ms ease, box-shadow 160ms ease;
      }

      .add-form input::placeholder {
        color: #a4a59e;
      }

      .add-form input:focus {
        border-color: #9baa94;
        box-shadow: 0 0 0 3px rgb(82 107 77 / 11%);
      }

      .add-button {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        justify-content: center;
        gap: 7px;
        min-width: 94px;
        padding: 0 15px;
        border: 0;
        border-radius: 10px;
        background: var(--green);
        color: #fff;
        cursor: pointer;
        font-size: 13px;
        font-weight: 650;
        transition: background 160ms ease, transform 160ms ease;
      }

      .add-button:hover {
        background: var(--green-dark);
      }

      .add-button:active {
        transform: scale(0.98);
      }

      .add-button:focus-visible,
      .filter:focus-visible,
      .clear-button:focus-visible,
      .delete-button:focus-visible,
      .check-button:focus-visible {
        outline: 3px solid rgb(82 107 77 / 35%);
        outline-offset: 2px;
      }

      .plus {
        font-size: 19px;
        font-weight: 400;
        line-height: 1;
      }

      .task-list {
        min-height: 100px;
        margin: 0;
        padding: 4px 20px;
        list-style: none;
      }

      .task {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 58px;
        border-bottom: 1px solid var(--line);
      }

      .task:last-child {
        border-bottom: 0;
      }

      .check-button {
        display: grid;
        width: 22px;
        height: 22px;
        flex: 0 0 auto;
        place-items: center;
        padding: 0;
        border: 1.5px solid #d5d7cf;
        border-radius: 50%;
        background: transparent;
        color: #fff;
        cursor: pointer;
        transition: background 160ms ease, border-color 160ms ease;
      }

      .check-button:hover {
        border-color: var(--green);
      }

      .task.completed .check-button {
        border-color: var(--green);
        background: var(--green);
      }

      .task-text {
        min-width: 0;
        flex: 1;
        overflow-wrap: anywhere;
        font-size: 14px;
        line-height: 1.5;
      }

      .task.completed .task-text {
        color: #a0a198;
        text-decoration: line-through;
        text-decoration-color: #b7b9b0;
      }

      .delete-button {
        display: grid;
        width: 32px;
        height: 32px;
        flex: 0 0 auto;
        place-items: center;
        padding: 0;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: #9a9c94;
        cursor: pointer;
        font-size: 20px;
        opacity: 0;
        transition: background 160ms ease, color 160ms ease, opacity 160ms ease;
      }

      .task:hover .delete-button,
      .delete-button:focus-visible {
        opacity: 1;
      }

      .delete-button:hover {
        background: #f7eeea;
        color: #9c5949;
      }

      .empty-state {
        padding: 30px 12px;
        color: var(--muted);
        text-align: center;
      }

      .empty-icon {
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        margin: 0 auto 12px;
        border-radius: 50%;
        background: var(--green-pale);
        color: var(--green);
        font-size: 19px;
      }

      .empty-state p {
        margin: 0;
        font-size: 13px;
      }

      .list-footer {
        display: flex;
        min-height: 58px;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 20px;
        border-top: 1px solid var(--line);
      }

      .items-left {
        flex: 1 1 90px;
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }

      .filters {
        display: flex;
        flex: 0 0 auto;
        gap: 3px;
      }

      .filter,
      .clear-button {
        padding: 7px 9px;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 12px;
        white-space: nowrap;
      }

      .filter:hover,
      .clear-button:hover {
        color: var(--ink);
      }

      .filter[aria-pressed="true"] {
        background: var(--green-pale);
        color: var(--green-dark);
        font-weight: 650;
      }

      .clear-button {
        flex: 1 1 100px;
        text-align: right;
      }

      .clear-button:disabled {
        cursor: default;
        opacity: 0.45;
      }

      .hint {
        margin: 18px 0 0;
        color: #9b9d95;
        font-size: 12px;
        text-align: center;
      }

      @media (max-width: 460px) {
        body {
          padding: 40px 14px;
        }

        .add-form {
          padding: 15px;
        }

        .task-list {
          padding-right: 15px;
          padding-left: 15px;
        }

        .list-footer {
          flex-wrap: wrap;
          justify-content: center;
          gap: 5px 8px;
          padding: 10px 12px;
        }

        .items-left,
        .clear-button {
          flex-basis: calc(50% - 8px);
        }

        .clear-button {
          text-align: right;
        }

        .filters {
          order: 1;
        }

        .delete-button {
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="intro">
        <p class="eyebrow">A little space to focus</p>
        <h1>Little List</h1>
        <p class="subtitle">One thing at a time. You’ve got this.</p>
      </header>

      <section class="list-card" aria-label="To-do list">
        <form class="add-form" id="add-form">
          <label for="task-input" class="visually-hidden">New task</label>
          <input
            id="task-input"
            name="task"
            type="text"
            placeholder="What would you like to do?"
            maxlength="160"
            autocomplete="off"
            required
          >
          <button class="add-button" type="submit">
            <span class="plus" aria-hidden="true">+</span>
            <span>Add task</span>
          </button>
        </form>

        <ul class="task-list" id="task-list" aria-live="polite"></ul>

        <footer class="list-footer">
          <span class="items-left" id="items-left" aria-live="polite"></span>
          <nav class="filters" aria-label="Filter tasks">
            <button class="filter" type="button" data-filter="all" aria-pressed="true">All</button>
            <button class="filter" type="button" data-filter="active" aria-pressed="false">Active</button>
            <button class="filter" type="button" data-filter="completed" aria-pressed="false">Done</button>
          </nav>
          <button class="clear-button" id="clear-completed" type="button">Clear done</button>
        </footer>
      </section>

      <p class="hint">Your list is saved automatically on this device.</p>
    </main>

    <script>
      const STORAGE_KEY = "little-list-tasks";
      const form = document.querySelector("#add-form");
      const input = document.querySelector("#task-input");
      const taskList = document.querySelector("#task-list");
      const itemsLeft = document.querySelector("#items-left");
      const clearButton = document.querySelector("#clear-completed");
      const filterButtons = document.querySelectorAll(".filter");

      let tasks = loadTasks();
      let currentFilter = "all";

      function loadTasks() {
        try {
          const savedTasks = localStorage.getItem(STORAGE_KEY);
          if (!savedTasks) return [];

          const parsedTasks = JSON.parse(savedTasks);
          if (!Array.isArray(parsedTasks)) return [];

          return parsedTasks.filter((task) =>
            task &&
            typeof task.id === "string" &&
            typeof task.text === "string" &&
            typeof task.completed === "boolean"
          );
        } catch (error) {
          console.error("Could not load your saved tasks.", error);
          return [];
        }
      }

      function saveTasks() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        } catch (error) {
          console.error("Could not save your tasks.", error);
        }
      }

      function renderTasks() {
        taskList.replaceChildren();

        const visibleTasks = tasks.filter((task) => {
          if (currentFilter === "active") return !task.completed;
          if (currentFilter === "completed") return task.completed;
          return true;
        });

        if (visibleTasks.length === 0) {
          const emptyItem = document.createElement("li");
          emptyItem.className = "empty-state";

          const icon = document.createElement("span");
          icon.className = "empty-icon";
          icon.setAttribute("aria-hidden", "true");
          icon.textContent = currentFilter === "completed" ? "✓" : "✳";

          const message = document.createElement("p");
          if (tasks.length === 0) {
            message.textContent = "Your list is clear. Add a task to get started.";
          } else if (currentFilter === "active") {
            message.textContent = "All caught up — every task is done.";
          } else {
            message.textContent = "No completed tasks yet.";
          }

          emptyItem.append(icon, message);
          taskList.append(emptyItem);
        } else {
          visibleTasks.forEach((task) => {
            const item = document.createElement("li");
            item.className = task.completed ? "task completed" : "task";

            const checkButton = document.createElement("button");
            checkButton.className = "check-button";
            checkButton.type = "button";
            checkButton.setAttribute("aria-label", task.completed ? `Mark ${task.text} as active` : `Mark ${task.text} as done`);
            checkButton.setAttribute("aria-pressed", String(task.completed));
            checkButton.addEventListener("click", () => toggleTask(task.id));
            if (task.completed) {
              const checkmark = document.createElement("span");
              checkmark.setAttribute("aria-hidden", "true");
              checkmark.textContent = "✓";
              checkButton.append(checkmark);
            }

            const text = document.createElement("span");
            text.className = "task-text";
            text.textContent = task.text;

            const deleteButton = document.createElement("button");
            deleteButton.className = "delete-button";
            deleteButton.type = "button";
            deleteButton.setAttribute("aria-label", `Delete ${task.text}`);
            deleteButton.textContent = "×";
            deleteButton.addEventListener("click", () => deleteTask(task.id));

            item.append(checkButton, text, deleteButton);
            taskList.append(item);
          });
        }

        const activeCount = tasks.filter((task) => !task.completed).length;
        itemsLeft.textContent = `${activeCount} ${activeCount === 1 ? "task" : "tasks"} left`;
        clearButton.disabled = !tasks.some((task) => task.completed);

        filterButtons.forEach((button) => {
          button.setAttribute("aria-pressed", String(button.dataset.filter === currentFilter));
        });
      }

      function toggleTask(id) {
        tasks = tasks.map((task) =>
          task.id === id ? { ...task, completed: !task.completed } : task
        );
        saveTasks();
        renderTasks();
      }

      function deleteTask(id) {
        tasks = tasks.filter((task) => task.id !== id);
        saveTasks();
        renderTasks();
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) {
          input.focus();
          return;
        }

        tasks.unshift({
          id: `${Date.now()}-${Math.random().toString(36).slice(2)}`,
          text,
          completed: false
        });
        saveTasks();
        renderTasks();
        form.reset();
        input.focus();
      });

      filterButtons.forEach((button) => {
        button.addEventListener("click", () => {
          currentFilter = button.dataset.filter;
          renderTasks();
        });
      });

      clearButton.addEventListener("click", () => {
        tasks = tasks.filter((task) => !task.completed);
        saveTasks();
        renderTasks();
      });

      renderTasks();
    </script>
  </body>
</html>
